<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZELZAL Dashboard - العملاء</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a15;color:#fff;min-height:100vh;display:flex}
.sidebar{width:220px;background:#0d0d1a;padding:20px;border-left:1px solid #ffffff0a;min-height:100vh;flex-shrink:0}
.logo{font-size:18px;font-weight:700;background:linear-gradient(135deg,#00f5a0,#00d9f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:25px;text-align:center}
.nav-item{display:block;padding:10px 15px;border-radius:8px;color:#889;font-size:14px;text-decoration:none;margin-bottom:5px;transition:all .3s}
.nav-item:hover,.nav-item.active{background:#00f5a010;color:#00f5a0}
.logout{color:#ff5555;margin-top:30px}
.main{flex:1;padding:30px}
h1{font-size:24px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;background:#111122;border-radius:12px;overflow:hidden;font-size:13px}
th{padding:12px;text-align:right;background:#0d0d1a;color:#00f5a0;font-weight:600;font-size:12px}
td{padding:10px 12px;border-top:1px solid #ffffff08;color:#889}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge.active{background:#00f5a015;color:#00f5a0}
.badge.inactive{background:#ff555515;color:#ff5555}
.btn{padding:5px 10px;border-radius:6px;border:none;font-size:11px;cursor:pointer}
.btn-danger{background:#ff5555;color:#fff}
.btn-toggle{background:#00d9f5;color:#0a0a15}
.key{font-family:monospace;direction:ltr;font-size:11px;color:#00f5a0}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo">ZELZAL</div>
<a href="/" class="nav-item">📊 الإحصائيات</a>
<a href="/customers" class="nav-item active">👥 العملاء</a>
<a href="#" class="nav-item" onclick="document.getElementById('pwOverlay').style.display='flex';return false">🔑 تغيير كلمة السر</a>
<a href="/logout" class="nav-item logout">🚪 خروج</a>
</div>
<!-- Password Change Modal -->
<div class="overlay" id="pwOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000000aa;align-items:center;justify-content:center;z-index:1000">
<div style="background:#111122;border:1px solid #ffffff0a;border-radius:16px;padding:30px;width:420px;max-width:90%">
<h2 style="margin-bottom:15px;font-size:18px;color:#00f5a0">🔑 تغيير كلمة السر</h2>
<form method="POST" action="/admin/change-password">
<input type="password" name="old_password" placeholder="كلمة السر القديمة" required style="width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid #ffffff0a;background:#0d0d1a;color:#fff;font-size:13px">
<input type="password" name="new_password" placeholder="كلمة السر الجديدة" minlength="6" required style="width:100%;padding:10px;margin-bottom:10px;border-radius:6px;border:1px solid #ffffff0a;background:#0d0d1a;color:#fff;font-size:13px">
<button type="submit" style="width:100%;padding:10px;background:linear-gradient(135deg,#00f5a0,#00d9f5);color:#0a0a15;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px">💾 حفظ</button>
<button type="button" style="width:100%;padding:10px;border:1px solid #00f5a033;color:#00f5a0;background:transparent;border-radius:6px;font-size:13px;cursor:pointer" onclick="document.getElementById('pwOverlay').style.display='none'">إلغاء</button>
</form>
</div>
</div>

<div class="main">
<h1>👥 إدارة العملاء</h1>
<div style="margin-bottom:15px;display:flex;gap:10px;align-items:center">
<input id="searchInput" placeholder="🔍 بحث..." style="padding:8px 12px;border-radius:6px;border:1px solid #ffffff0a;background:#0d0d1a;color:#fff;width:250px;font-size:13px">
<span style="color:#667;font-size:13px" id="countLabel">0 عميل</span>
</div>
<table>
<thead><tr><th>#</th><th>الاسم</th><th>رقم الهاتف</th><th>المنتج</th><th>المدة</th><th>مفتاح الترخيص</th><th>تاريخ الدفع</th><th>تنتهي في</th><th>الحالة</th><th>تحكم</th></tr></thead>
<tbody id="customersBody"></tbody>
</table>
</div>
<script>
function loadCustomers() {
fetch('/api/customers').then(r=>r.json()).then(rows=>{
document.getElementById('countLabel').textContent = rows.length + ' عميل';
const tbody = document.getElementById('customersBody');
tbody.innerHTML = rows.map((r,i) => `
<tr>
<td>${i+1}</td>
<td>${r.name || '-'}</td>
<td>${r.phone || '-'}</td>
<td>${r.product === 'both' ? '🏆 مزدوجة' : r.product === 'netguard' ? '📡 NetGuard' : '🛡️ CYBER SHIELD'}</td>
<td>${r.period}</td>
<td class="key">${r.license_key}</td>
<td>${r.payment_date || '-'}</td>
<td style="font-size:11px">${r.expires_at ? new Date(r.expires_at).toLocaleDateString('ar-EG') : '-'}</td>
<td><span class="badge ${r.active ? 'active' : 'inactive'}">${r.active ? 'نشط' : 'موقف'}</span></td>
<td class="actions" style="display:flex;gap:5px">
<button class="btn btn-toggle" onclick="toggle(${r.id})">${r.active ? 'إيقاف' : 'تفعيل'}</button>
<button class="btn btn-danger" onclick="del(${r.id})">حذف</button>
</td>
</tr>
`).join('');
}).catch(()=>{});
}
function toggle(id) {
fetch('/api/customers/toggle/'+id, {method:'POST'}).then(()=>loadCustomers());
}
function del(id) {
if(confirm('حذف هذا العميل؟')) fetch('/api/customers/delete/'+id, {method:'POST'}).then(()=>loadCustomers());
}
document.getElementById('searchInput').addEventListener('input', function(){
const q = this.value.toLowerCase();
document.querySelectorAll('#customersBody tr').forEach(tr => {
tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
});
});
loadCustomers();
</script>
</body>
</html>
