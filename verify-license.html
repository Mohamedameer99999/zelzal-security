<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 التحقق من الترخيص - ZELZAL SECURITY</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #0a0a15;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 500px;
  background: #12121f;
  border: 1px solid #00f5a022;
  border-radius: 16px;
  padding: 40px 30px;
  box-shadow: 0 0 40px #00f5a008;
}
.logo { text-align: center; margin-bottom: 30px; }
.logo h1 { color: #00f5a0; font-size: 24px; letter-spacing: 1px; }
.logo span { color: #00d9f5; }
.logo p { color: #888; font-size: 13px; margin-top: 5px; }
.input-group { margin-bottom: 20px; }
.input-group label {
  display: block;
  font-size: 14px;
  color: #aaa;
  margin-bottom: 8px;
}
.input-group input {
  width: 100%;
  padding: 14px 16px;
  background: #0d0d1a;
  border: 1px solid #2a2a3a;
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  direction: ltr;
  text-align: left;
  font-family: 'Courier New', monospace;
  transition: border 0.3s;
}
.input-group input:focus {
  outline: none;
  border-color: #00f5a0;
  box-shadow: 0 0 15px #00f5a020;
}
button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #00f5a0, #00d9f5);
  border: none;
  border-radius: 10px;
  color: #0a0a15;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}
button:hover { transform: translateY(-2px); box-shadow: 0 5px 25px #00f5a040; }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
button .spinner { display: none; }
button.loading .spinner { display: inline-block; }
button.loading .text { display: none; }

.result {
  margin-top: 25px;
  padding: 20px;
  border-radius: 12px;
  display: none;
}
.result.valid { display: block; background: #00f5a008; border: 1px solid #00f5a0; }
.result.invalid { display: block; background: #ff444410; border: 1px solid #ff4444; }
.result .icon { font-size: 48px; text-align: center; margin-bottom: 10px; }
.result .title { font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px; }
.result.valid .title { color: #00f5a0; }
.result.invalid .title { color: #ff4444; }
.result .detail { padding: 8px 0; border-bottom: 1px solid #ffffff08; font-size: 14px; }
.result .detail:last-child { border-bottom: none; }
.result .detail .label { color: #888; }
.result .detail .value { color: #fff; float: left; }

.status-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}
.status-badge.active { background: #00f5a020; color: #00f5a0; }
.status-badge.expired { background: #ff444420; color: #ff4444; }
.status-badge.inactive { background: #ffaa0020; color: #ffaa00; }

.footer { text-align: center; margin-top: 30px; font-size: 12px; color: #555; }
.footer a { color: #00f5a0; text-decoration: none; }
.spinner-icon {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2px solid #0a0a15;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-left: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>⚡ ZELZAL <span>SECURITY</span></h1>
    <p>التحقق من مفتاح الترخيص</p>
  </div>
  <div class="input-group">
    <label>🔑 أدخل مفتاح الترخيص</label>
    <input type="text" id="licenseKey" placeholder="CYBERSHIELD-XXXXX-XXXXX-XXXXX-XXXXX-20260615-XXXXXXXX" autocomplete="off">
  </div>
  <button id="verifyBtn" onclick="verifyLicense()">
    <span class="text">🔍 تحقق من المفتاح</span>
    <span class="spinner"><span class="spinner-icon"></span> جاري التحقق...</span>
  </button>
  <div class="result" id="result"></div>
  <div class="footer">
    <a href="https://t.me/ZELZAL_Security" target="_blank">📢 قناة التلجرام</a> • 
    <a href="https://mohamedameer99999.github.io/zelzal-security/" target="_blank">🌐 الموقع الرسمي</a>
  </div>
</div>

<script>
const API_URL = 'https://ZELZALSECURITY.pythonanywhere.com/verify-license';

async function verifyLicense() {
  const key = document.getElementById('licenseKey').value.trim();
  const btn = document.getElementById('verifyBtn');
  const result = document.getElementById('result');

  if (!key) {
    result.className = 'result invalid';
    result.innerHTML = '<div class="icon">⚠️</div><div class="title">يرجى إدخال مفتاح الترخيص</div>';
    result.style.display = 'block';
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;
  result.style.display = 'none';

  try {
    const res = await fetch(API_URL + '?key=' + encodeURIComponent(key), { timeout: 10000 });
    const data = await res.json();
    showResult(data);
  } catch (e) {
    result.className = 'result invalid';
    result.innerHTML = '<div class="icon">❌</div><div class="title">فشل الاتصال بخادم التحقق</div><div class="detail">تأكد من اتصالك بالإنترنت وحاول مرة أخرى</div>';
    result.style.display = 'block';
  }

  btn.classList.remove('loading');
  btn.disabled = false;
}

function showResult(data) {
  const result = document.getElementById('result');

  if (data.valid) {
    const statusClass = data.status === 'نشط' ? 'active' : 'expired';
    result.className = 'result valid';
    result.innerHTML = `
      <div class="icon">✅</div>
      <div class="title">الترخيص صالح ونشط</div>
      <div class="detail"><span class="label">المنتج</span> <span class="value">${data.product}</span></div>
      <div class="detail"><span class="label">العميل</span> <span class="value">${data.customer || 'غير محدد'}</span></div>
      <div class="detail"><span class="label">الخطة</span> <span class="value">${data.plan || 'غير محدد'}</span></div>
      <div class="detail"><span class="label">تاريخ الانتهاء</span> <span class="value">${data.expiry}</span></div>
      <div class="detail"><span class="label">الحالة</span> <span class="value"><span class="status-badge ${statusClass}">${data.status}</span></span></div>
    `;
  } else {
    result.className = 'result invalid';
    let extra = '';
    if (data.hmac_valid) {
      extra = '<div class="detail">✅ التوقيع صحيح ولكن المفتاح غير مسجل في قاعدة البيانات</div>';
    }
    result.innerHTML = `
      <div class="icon">❌</div>
      <div class="title">الترخيص غير صالح</div>
      <div class="detail"><span class="label">السبب</span> <span class="value">${data.message || 'مفتاح غير صالح'}</span></div>
      ${extra}
    `;
  }
  result.style.display = 'block';
}

document.getElementById('licenseKey').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') verifyLicense();
});
</script>
</body>
</html>
