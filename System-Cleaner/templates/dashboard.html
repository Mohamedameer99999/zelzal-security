<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ tool_name }} - ZELZAL SECURITY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a15;color:#fff;min-height:100vh}
.header{background:#0d0d1a;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid {{ tool_color }}33}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,{{ tool_color }},{{ tool_color }}88);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0a0a15}
.logo-text{font-size:18px;font-weight:700;color:{{ tool_color }}}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:#888}
.status-dot{width:8px;height:8px;border-radius:50%;background:#00f5a0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.container{max-width:1000px;margin:30px auto;padding:0 20px}
h2{font-size:24px;margin-bottom:20px;color:{{ tool_color }}}
.card{background:linear-gradient(135deg,#0d0d1a,#1a1a2e);border-radius:16px;padding:25px;margin-bottom:20px;border:1px solid #ffffff0a}
.card h3{font-size:16px;color:#888;margin-bottom:15px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:25px}
.stat{background:linear-gradient(135deg,#0d0d1a,#1a1a2e);border-radius:12px;padding:20px;text-align:center;border:1px solid #ffffff0a}
.stat-value{font-size:28px;font-weight:700;color:{{ tool_color }}}
.stat-label{font-size:13px;color:#888;margin-top:5px}
.btn{padding:10px 24px;border:none;border-radius:10px;background:linear-gradient(135deg,{{ tool_color }},{{ tool_color }}88);color:#0a0a15;font-size:14px;font-weight:600;cursor:pointer;transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px {{ tool_color }}44}
.btn-outline{padding:8px 18px;border:1px solid {{ tool_color }}44;border-radius:10px;background:transparent;color:{{ tool_color }};font-size:13px;cursor:pointer;transition:.3s}
.btn-outline:hover{background:{{ tool_color }}11}
.progress{height:8px;background:#ffffff0a;border-radius:4px;margin:10px 0;overflow:hidden}
.progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,{{ tool_color }},{{ tool_color }}88);transition:width .5s}
.clean-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff0a}
.clean-item:last-child{border-bottom:none}
.clean-size{color:{{ tool_color }};font-weight:600}
</style>
</head>
<body>
<div class="header">
<div class="logo">
<div class="logo-icon">Z</div>
<span class="logo-text">{{ tool_name }}</span>
</div>
<div class="status"><span class="status-dot"></span>نشط — مرخص</div>
</div>
<div class="container">
<h2>منظف النظام</h2>
<div class="stats-grid">
<div class="stat"><div class="stat-value">4.7GB</div><div class="stat-label">ملفات غير ضرورية</div></div>
<div class="stat"><div class="stat-value">1,287</div><div class="stat-label">ملفات قابلة للحذف</div></div>
<div class="stat"><div class="stat-value">85%</div><div class="stat-label">صحة النظام</div></div>
<div class="stat"><div class="stat-value">آخر تنظيف</div><div class="stat-label">منذ 3 أيام</div></div>
</div>
<div class="card">
<h3>🧹 تفاصيل المخلفات</h3>
<div class="clean-item"><span>🗑️ الملفات المؤقتة</span><span class="clean-size">1.2GB</span></div>
<div class="progress"><div class="progress-bar" style="width:26%"></div></div>
<div class="clean-item"><span>📦 ذاكرة التخزين المؤقت</span><span class="clean-size">2.1GB</span></div>
<div class="progress"><div class="progress-bar" style="width:45%"></div></div>
<div class="clean-item"><span>📝 سجلات النظام</span><span class="clean-size">0.8GB</span></div>
<div class="progress"><div class="progress-bar" style="width:17%"></div></div>
<div class="clean-item"><span>♻️ سلة المحذوفات</span><span class="clean-size">0.6GB</span></div>
<div class="progress"><div class="progress-bar" style="width:13%"></div></div>
<div style="margin-top:20px">
<button class="btn" onclick="analyzeSystem()">🔍 تحليل</button>
<button class="btn" onclick="cleanSystem()" style="margin-right:10px">🧹 تنظيف الآن</button>
</div>
</div>
<div class="card">
<h3>⚙️ خيارات التنظيف</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
<button class="btn-outline">🗑️ Temp Files</button>
<button class="btn-outline">📦 Cache</button>
<button class="btn-outline">📝 Logs</button>
<button class="btn-outline">♻️ Recycle Bin</button>
<button class="btn-outline">📊 Registry</button>
</div>
</div>
</div>
<script>
async function analyzeSystem() {
const btns = document.querySelectorAll('.btn'); btns.forEach(b => b.disabled = true);
try { const r = await fetch('/api/analyze'); const d = await r.json(); alert(`✅ تم التحليل: ${d.total_waste} مخلفات`); } catch(e) { alert('❌ فشل التحليل'); }
btns.forEach(b => b.disabled = false);
}
async function cleanSystem() {
const btns = document.querySelectorAll('.btn'); btns.forEach(b => { b.disabled = true; if(b.textContent.includes('🧹')) b.textContent = '⏳ جاري التنظيف...'; });
try { const r = await fetch('/api/clean', {method:'POST'}); const d = await r.json(); alert(`✅ تم تنظيف ${d.cleaned} — ${d.files_removed} ملف`); } catch(e) { alert('❌ فشل التنظيف'); }
btns.forEach(b => { b.disabled = false; if(b.textContent.includes('⏳')) b.textContent = '🧹 تنظيف الآن'; });
}
</script>
</body>
</html>
