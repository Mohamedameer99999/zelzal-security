<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NetGuard Monitor — دخول</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a15;color:#e8e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#12122a;border:1px solid rgba(0,245,160,.12);border-radius:16px;padding:48px 40px;width:380px;max-width:90vw;text-align:center}
.logo{font-size:48px;margin-bottom:12px}
h1{font-size:22px;font-weight:700;margin-bottom:4px;background:linear-gradient(135deg,#00f5a0,#00d9f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:13px;color:#8888aa;margin-bottom:32px}
.input-group{text-align:right;margin-bottom:20px}
.input-group label{display:block;font-size:13px;color:#8888aa;margin-bottom:6px}
.input-group input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(0,245,160,.12);background:#0f0f1e;color:#e8e8f0;font-size:15px;transition:border .3s;outline:none}
.input-group input:focus{border-color:#00f5a0}
.input-group input::placeholder{color:#555}
.btn{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#00f5a0,#00d9f5);color:#0a0a15;font-size:16px;font-weight:700;cursor:pointer;transition:transform .3s}
.btn:hover{transform:scale(1.02)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{color:#ff4444;font-size:13px;margin-top:12px;display:none}
.loader{display:inline-block;width:18px;height:18px;border:3px solid #0a0a15;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-left:8px;display:none}
@keyframes spin{to{transform:rotate(360deg)}
</style>
</head><body>
<div class="login-box">
  <div class="logo">🛡️</div>
  <h1>NetGuard Monitor</h1>
  <p class="sub">يرجى تسجيل الدخول للمتابعة</p>
  <form id="loginForm" onsubmit="return doLogin(event)">
    <div class="input-group">
      <label>اسم المستخدم</label>
      <input type="text" id="user" placeholder="admin" autocomplete="username" required>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="loginBtn"><span id="btnText">دخول</span><span class="loader" id="loader"></span></button>
    <div class="error" id="errorMsg"></div>
  </form>
  <div style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(0,245,160,.08);font-size:12px;color:#555">
    <span id="loginLicenseStatus">🔐 التحقق من الترخيص...</span>
  </div>
  <script>
  fetch('/api/license/status').then(r=>r.json()).then(d=>{
    const el = document.getElementById('loginLicenseStatus');
    if (d.valid) el.textContent = '🔐 ' + d.message;
    else el.innerHTML = '🔓 <a href="/" style="color:#00f5a0">تفعيل الترخيص</a>';
  }).catch(()=>{});
  </script>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const txt = document.getElementById('btnText');
  const ld = document.getElementById('loader');
  const err = document.getElementById('errorMsg');
  btn.disabled = true;
  txt.style.display = 'none';
  ld.style.display = 'inline-block';
  err.style.display = 'none';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: document.getElementById('user').value, password: document.getElementById('pass').value})
    });
    const data = await r.json();
    if (data.success) {
      window.location.href = '/';
    } else {
      err.textContent = data.error || 'خطأ في الدخول';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = 'تعذر الاتصال بالخادم';
    err.style.display = 'block';
  }
  btn.disabled = false;
  txt.style.display = 'inline';
  ld.style.display = 'none';
}
</script>
</body></html>
