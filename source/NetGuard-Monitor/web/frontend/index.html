<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NetGuard Monitor — مراقب الشبكة</title>
<link rel="stylesheet" href="css/style.css">
</head><body>

<nav>
  <div class="nav-brand">🛡️ NetGuard Monitor</div>
  <div class="nav-info">
    <span id="navStatus" class="status-dot green"></span>
    <span id="navUptime">—</span>
    <span style="color:#666;margin:0 8px">|</span>
    <span id="navDevices">0 أجهزة</span>
  </div>
</nav>

<div class="container">
  <!-- STATS ROW -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="statDevices">0</div><div class="stat-lbl">الأجهزة</div></div>
    <div class="stat-card"><div class="stat-val" id="statOnline">0</div><div class="stat-lbl">متصل</div></div>
    <div class="stat-card"><div class="stat-val" id="statAlerts">0</div><div class="stat-lbl">تنبيهات</div></div>
    <div class="stat-card"><div class="stat-val" id="statSpeed">0</div><div class="stat-lbl">Mbps</div></div>
    <div class="stat-card"><div class="stat-val" id="statSent">0</div><div class="stat-lbl">أرسل (MB)</div></div>
    <div class="stat-card"><div class="stat-val" id="statRecv">0</div><div class="stat-lbl">استقبل (MB)</div></div>
  </div>

  <div class="grid-2">
    <!-- DEVICES -->
    <div class="panel">
      <div class="panel-hdr">📡 الأجهزة المتصلة</div>
      <div class="table-wrap">
        <table><thead><tr><th>IP</th><th>MAC</th><th>الجهاز</th><th>المزود</th><th>آخر ظهور</th><th>الحالة</th></tr></thead>
        <tbody id="devicesBody"></tbody></table>
      </div>
    </div>

    <!-- ALERTS -->
    <div class="panel">
      <div class="panel-hdr">⚠️ التنبيهات</div>
      <div id="alertsList"></div>
    </div>
  </div>

  <div class="grid-2">
    <!-- BANDWIDTH CHART -->
    <div class="panel">
      <div class="panel-hdr">📊 سرعة الشبكة (آخر 30 دقيقة)</div>
      <canvas id="bwChart" height="200"></canvas>
    </div>

    <!-- NETWORK HISTORY -->
    <div class="panel">
      <div class="panel-hdr">📈 تاريخ الشبكة (آخر 6 ساعات)</div>
      <canvas id="historyChart" height="200"></canvas>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body></html>
